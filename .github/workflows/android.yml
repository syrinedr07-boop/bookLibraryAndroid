name: Android CI/CD Workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Local Properties with GitHub Secrets
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY" >> local.properties

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/debug app/src/preprod
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/src/debug/google-services.json
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/src/preprod/google-services.json
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK (on develop push)
        if: github.ref == 'refs/heads/develop'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Preprod APK (on PR to main)
        if: github.event_name == 'pull_request'
        run: ./gradlew assemblePreprod --stacktrace

      - name: Build Release APK (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-debug
          path: app/build/outputs/apk/debug/

      - name: Upload Preprod APK Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preprod-apk
          path: app/build/outputs/apk/preprod/

      - name: Upload Release APK Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-prod
          path: app/build/outputs/apk/release/

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-prod
          path: app/build/outputs/apk/release/

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.0
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Production Release build from main branch"
